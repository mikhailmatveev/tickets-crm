services:

  mariadb:
    image: mariadb:${MARIADB_VERSION}
    container_name: ${APP_NAME}_db
    restart: unless-stopped
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:${REDIS_VERSION}-alpine
    container_name: ${APP_NAME}_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: ${APP_NAME}_php
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: ${APP_PATH}
    volumes:
      - .:${APP_PATH}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: ${APP_NAME}_queue
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: ${APP_PATH}
    volumes:
      - .:${APP_PATH}
    command: php artisan queue:listen --tries=3 --timeout=0
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    container_name: ${APP_NAME}_node
    working_dir: ${APP_PATH}
    volumes:
      - .:${APP_PATH}
    command: sh -c "npm run dev"
    ports:
      - "${APP_FRONTEND_PORT}:${APP_FRONTEND_PORT}"

  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: ${APP_NAME}_nginx
    restart: unless-stopped
    ports:
      - "${APP_BACKEND_PORT}:80"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - .:${APP_PATH}
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template
    depends_on:
      - php

  mailpit:
    image: axllent/mailpit
    container_name: ${APP_NAME}_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"

volumes:
  dbdata:
    driver: 'local'
