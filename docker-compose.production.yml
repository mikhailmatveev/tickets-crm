services:

  mariadb:
    image: mariadb:${MARIADB_VERSION}
    container_name: ${APP_NAME}_db
    restart: unless-stopped
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:${REDIS_VERSION}-alpine
    container_name: ${APP_NAME}_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: ${APP_NAME}_php
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: ${APP_PATH}
    volumes:
      - .:${APP_PATH}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    container_name: ${APP_NAME}_queue
    restart: unless-stopped
    working_dir: ${APP_PATH}
    volumes:
      - .:${APP_PATH}
    command: php artisan queue:listen --tries=3 --timeout=0
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    container_name: ${APP_NAME}_node
    working_dir: ${APP_PATH}
    volumes:
      - .:${APP_PATH}
    command: sh -c "npm ci && npm run build"

  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: ${APP_NAME}_nginx
    restart: unless-stopped
    ports:
      - "${APP_BACKEND_PORT:-80}:80"
      - "${APP_BACKEND_PORT_SECURE}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - .:${APP_PATH}
      - ./docker/nginx/production.conf:/etc/nginx/templates/default.conf.template
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - php

  certbot:
    image: certbot/certbot
    container_name: ${APP_NAME}_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

volumes:
  dbdata:
  certbot_certs:
  certbot_www:
